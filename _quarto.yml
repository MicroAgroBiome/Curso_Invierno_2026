project:
  type: book
  output-dir: docs
  resources:
    - notebooks/*.ipynb
    - notebooks/participante/*.ipynb
    - interactivos/*.html

book:
  title: "MicroAgroBiome"
  author:
    - name: Haydeé Peruyero
      degrees: PhD
      url: https://haydeeperuyero.github.io/
      orcid: 0000-0002-4820-1798
      email: haydeeperuyero@unam.mx
      affiliations:
        - name: ENES-Juriquilla, UNAM
          country: Mexico
          url: https://www.enesjuriquilla.unam.mx/?page_id=11292 
    - name: Evelia Coss
      degrees: PhD
      url: https://eveliacoss.github.io/ 
      orcid: 0000-0002-7087-2977
      email: ecosnav@gmail.com
      affiliations:
        - name: ENES-Juriquilla, UNAM
          country: Mexico
          url: https://www.enesjuriquilla.unam.mx/  
    - name: David Alberto García Estrada
      degrees: MC
      url: https://davidalberto.github.io/
      orcid: 0009-0007-1169-5329
      email: david.garcia@cimav.edu.mx
      affiliations:
        - name: Centro de Investigación en Materiales Avanzados (CIMAV)
          country: Mexico
          url: https://cimav.edu.mx/ 
    - name: Manuel Alejandro Ucan Puc
      degrees: PhD
      url: https://alejandroucanpuc.github.io/
      orcid: 0000-0002-0037-9394
      email: alejandro.ucan-puc@tec.mx
      affiliations:
        - name: Escuela de Ingeniería y Ciencias, Tecnológico de Monterrey
          country: Mexico
          url: https://research.tec.mx/vivo-tec/display/PID_318207          
  date: "11/30/2026"
  page-navigation: true
  
  chapters:
    - index.qmd
    - dinamica_trabajo.qmd
    - proyecto.qmd
    - part: "**Día 1**"
      chapters:
        - mapa_del_tesoro.qmd
        - intro_datos.qmd
        - pruebas_hipotesis.qmd
    - part: "**Día 2**"
      chapters:
        - composicional.qmd
    - part: "**Día 3**"
      chapters:
        - clustering.qmd 
    - part: "**Día 4**"
      chapters:
        - cap04_TDA.qmd
  
  # Information
  site-url: https://microagrobiome.github.io/Curso_Invierno_2026/
  repo-url: https://github.com/MicroAgroBiome/Curso_Invierno_2026
  sharing: [twitter, facebook, linkedin]
  favicon: "logos/MicroAgroBiome.png"
  # Logo en la esquina superior de la barra lateral (manual de identidad, p. 2)
  sidebar:
    logo: "logos/MicroAgroBiome.png"

format:
  html:
    toc-depth: 4
    number-depth: 3
    # Identidad gráfica: colores y fuentes en _brand.yml; ajustes finos en styles.css
    theme:
      light: [cosmo, brand]
    css: styles.css
    code-fold: show # Ocultar codigo
    code-copy: true # Copy button

editor: visual

lang: es # configuración en Español

execute:
  error: true # Se aceptan errores
  message: false # Silenciar mensajes de salida
  echo: true
  freeze: auto   # mover aquí; dentro de format: html: Quarto lo ignora

bibliography: references.bib
